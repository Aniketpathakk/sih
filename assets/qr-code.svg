<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <!-- Clean QR Matrix representation -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <g fill="#000000">
    <!-- Top Left Finder Pattern -->
    <rect x="5" y="5" width="26" height="26"/>
    <rect x="8" y="8" width="20" height="20" fill="#FFFFFF"/>
    <rect x="12" y="12" width="12" height="12"/>

    <!-- Top Right Finder Pattern -->
    <rect x="69" y="5" width="26" height="26"/>
    <rect x="72" y="8" width="20" height="20" fill="#FFFFFF"/>
    <rect x="76" y="12" width="12" height="12"/>

    <!-- Bottom Left Finder Pattern -->
    <rect x="5" y="69" width="26" height="26"/>
    <rect x="8" y="72" width="20" height="20" fill="#FFFFFF"/>
    <rect x="12" y="76" width="12" height="12"/>

    <!-- Timing Patterns -->
    <rect x="34" y="15" width="4" height="4"/>
    <rect x="42" y="15" width="4" height="4"/>
    <rect x="50" y="15" width="4" height="4"/>
    <rect x="58" y="15" width="4" height="4"/>

    <rect x="15" y="34" width="4" height="4"/>
    <rect x="15" y="42" width="4" height="4"/>
    <rect x="15" y="50" width="4" height="4"/>
    <rect x="15" y="58" width="4" height="4"/>

    <!-- Data Elements Grid -->
    <rect x="36" y="26" width="6" height="6"/>
    <rect x="46" y="26" width="6" height="6"/>
    <rect x="56" y="26" width="6" height="6"/>

    <rect x="36" y="36" width="8" height="8"/>
    <rect x="48" y="36" width="6" height="6"/>
    <rect x="60" y="36" width="6" height="6"/>
    <rect x="72" y="36" width="8" height="6"/>
    <rect x="84" y="36" width="6" height="8"/>

    <rect x="26" y="48" width="6" height="6"/>
    <rect x="38" y="48" width="6" height="6"/>
    <rect x="50" y="48" width="8" height="8"/>
    <rect x="64" y="48" width="6" height="6"/>
    <rect x="76" y="48" width="8" height="8"/>

    <rect x="26" y="60" width="6" height="8"/>
    <rect x="38" y="60" width="8" height="6"/>
    <rect x="50" y="62" width="6" height="6"/>
    <rect x="62" y="60" width="8" height="8"/>
    <rect x="76" y="62" width="6" height="6"/>
    <rect x="88" y="60" width="6" height="6"/>

    <rect x="36" y="74" width="8" height="8"/>
    <rect x="48" y="74" width="6" height="6"/>
    <rect x="60" y="74" width="6" height="8"/>
    <rect x="72" y="74" width="8" height="6"/>
    <rect x="86" y="74" width="6" height="6"/>

    <rect x="36" y="86" width="6" height="6"/>
    <rect x="48" y="86" width="8" height="6"/>
    <rect x="62" y="86" width="6" height="6"/>
    <rect x="74" y="86" width="8" height="8"/>
    <rect x="86" y="86" width="6" height="6"/>
  </g>
</svg>

